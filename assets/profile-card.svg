    <radialGradient id="light" cx="50%" cy="0%" r="85%"><stop stop-color="#eaf1fd" stop-opacity=".8"/><stop offset="1" stop-color="#f7f9fc" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent"><stop stop-color="#2877ee"/><stop offset="1" stop-color="#8d58eb"/></linearGradient>
